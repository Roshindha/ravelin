# B18c: maroon / cream / tomato / neon theme (docs/SPEC_V2.md row (nn)). The colours here must equal app/theme.py (a test compares them).
# Fonts are OFL files bundled in app/static/fonts and served by Streamlit static serving: no CDN, no network request.
[theme]
base = "dark"
primaryColor = "#CDF73D"
backgroundColor = "#250104"
secondaryBackgroundColor = "#3B0A0F"
textColor = "#F4EBDD"
borderColor = "#5A1A20"
baseRadius = "6px"
font = "Instrument Sans"
headingFont = "Bricolage Grotesque"
codeFont = "IBM Plex Mono"
baseFontSize = 16

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-wght400-600.woff2"
weight = "400 600"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/BricolageGrotesque-wght600-800.woff2"
weight = "600 800"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.woff2"
weight = "400"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-SemiBold.woff2"
weight = "600"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
