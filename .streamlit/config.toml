# B18d: palette v2 (light) and fonts v2 (docs/SPEC_V2.md row (nn) + its B18d addendum). The colours here must equal app/theme.py (a test compares them).
# Fonts are OFL files bundled in app/static/fonts and served by Streamlit static serving: no CDN, no network request.
[theme]
base = "light"
primaryColor = "#3283BE"
backgroundColor = "#FEFDFE"
secondaryBackgroundColor = "#F3F7FB"
textColor = "#132A3E"
borderColor = "#D5E2EE"
baseRadius = "6px"
font = "Atkinson Hyperlegible Next"
headingFont = "Fraunces"
codeFont = "Atkinson Hyperlegible Mono"
baseFontSize = 16

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/AtkinsonHyperlegibleNext-wght400-600.woff2"
weight = "400 600"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/Fraunces-opsz-wght600-700.woff2"
weight = "600 700"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Mono"
url = "app/static/fonts/AtkinsonHyperlegibleMono-wght400-600.woff2"
weight = "400 600"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
fileWatcherType = "none"
runOnSave = false
# Streamlit Cloud: Python 3.11 (Advanced settings), main file app/streamlit_app.py, secrets none; set the environment variable RAVELIN_DEPLOY=1.

